name: rd
title: Regression Discontinuity
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Running variable
            children:
                - type: VariablesListBox
                  name: running
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment received (fuzzy RD)
            children:
                - type: VariablesListBox
                  name: treatment
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
          - type: TargetLayoutBox
            label: Cluster
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cutoff variable (multiple cutoffs)
            children:
                - type: VariablesListBox
                  name: cutVar
                  isTarget: true
                  maxItemCount: 1
    - type: TextBox
      name: cutoff
      label: Cutoff
      format: number
    - type: CheckBox
      name: kink
    - type: CollapseBox
      label: Estimation
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: TextBox
                  name: p
                  label: Polynomial order (p)
                  format: number
                - type: TextBox
                  name: q
                  label: Bias-correction order (q; 0 = p + 1)
                  format: number
                - type: ComboBox
                  name: kernel
                - type: ComboBox
                  name: vce
                - type: TextBox
                  name: nnmatch
                  label: Nearest neighbors
                  format: number
                - type: TextBox
                  name: level
                  label: Confidence level (%)
                  format: number
    - type: CollapseBox
      label: Bandwidth
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: ComboBox
                  name: bwselect
                - type: TextBox
                  name: hManual
                  label: Manual bandwidth h
                  format: number
                - type: TextBox
                  name: bManual
                  label: Manual bias bandwidth b
                  format: number
                - type: TextBox
                  name: donut
                  label: Donut hole radius
                  format: number
    - type: CollapseBox
      label: RD plot
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: CheckBox
                  name: plot
                - type: ComboBox
                  name: plotBins
                - type: TextBox
                  name: plotOrder
                  label: Global polynomial order
                  format: number
                - type: CheckBox
                  name: plotWindow
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
