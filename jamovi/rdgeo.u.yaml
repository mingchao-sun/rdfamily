name: rdgeo
title: RD Geographic / Two-Score Boundary
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment indicator
            children:
                - type: VariablesListBox
                  name: treatment
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Coordinate / score 1
            children:
                - type: VariablesListBox
                  name: x1
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Coordinate / score 2
            children:
                - type: VariablesListBox
                  name: x2
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Boundary vertices, coord. 1
            children:
                - type: VariablesListBox
                  name: bx
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Boundary vertices, coord. 2
            children:
                - type: VariablesListBox
                  name: by
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cluster
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  maxItemCount: 1
    - type: ComboBox
      name: boundary
    - type: TextBox
      name: c1
      label: Cutoff for score 1
      format: number
    - type: TextBox
      name: c2
      label: Cutoff for score 2
      format: number
    - type: CollapseBox
      label: Estimation
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: TextBox
                  name: p
                  label: Polynomial order (p)
                  format: number
                - type: ComboBox
                  name: bwselect
                - type: ComboBox
                  name: kernel
                - type: ComboBox
                  name: vce
                - type: TextBox
                  name: level
                  label: Confidence level (%)
                  format: number
                - type: TextBox
                  name: donut
                  label: Donut hole radius
                  format: number
    - type: CheckBox
      name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
