---
name: rd
title: Regression Discontinuity
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Estimation
menuTitle: Sharp / Fuzzy / Kink RD
menuSubtitle: Calonico et al. (2014)

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treatment
      title: Treatment received (fuzzy design, optional)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates (optional)
      type: Variables
      permitted:
          - numeric

    - name: cluster
      title: Cluster (optional)
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: cutVar
      title: Cutoff variable (multiple cutoffs, optional)
      type: Variable
      permitted:
          - numeric

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: kink
      title: Regression kink design (change in slope)
      type: Bool
      default: false

    - name: p
      title: Local polynomial order
      type: Integer
      default: 1
      min: 0
      max: 8

    - name: q
      title: Bias-correction order (0 = p + 1)
      type: Integer
      default: 0
      min: 0
      max: 9

    - name: bwselect
      title: Bandwidth selector
      type: List
      options:
          - name: mserd
            title: MSE-optimal, one common
          - name: msetwo
            title: MSE-optimal, two different
          - name: msesum
            title: MSE-optimal, for the sum of estimators
          - name: msecomb1
            title: MSE, median of common/sum
          - name: msecomb2
            title: MSE, median of all
          - name: cerrd
            title: CER-optimal, one common
          - name: certwo
            title: CER-optimal, two different
          - name: cersum
            title: CER-optimal, for the sum of estimators
          - name: cercomb1
            title: CER, median of common/sum
          - name: cercomb2
            title: CER, median of all
      default: mserd

    - name: hManual
      title: Manual bandwidth h (0 = automatic)
      type: Number
      default: 0
      min: 0

    - name: bManual
      title: Manual bias bandwidth b (0 = same as h)
      type: Number
      default: 0
      min: 0

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: Triangular
          - name: epanechnikov
            title: Epanechnikov
          - name: uniform
            title: Uniform
      default: triangular

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: nn
            title: Nearest neighbor
          - name: hc0
            title: HC0
          - name: hc1
            title: HC1
          - name: hc2
            title: HC2
          - name: hc3
            title: HC3
      default: nn

    - name: nnmatch
      title: Nearest neighbors
      type: Integer
      default: 3
      min: 1

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: donut
      title: Donut hole radius
      type: Number
      default: 0
      min: 0
      description: Observations closer than this to the cutoff are dropped.

    - name: plot
      title: RD plot
      type: Bool
      default: true

    - name: plotBins
      title: Binning method
      type: List
      options:
          - name: esmv
            title: Evenly spaced, mimicking variance
          - name: es
            title: Evenly spaced, IMSE-optimal
          - name: qsmv
            title: Quantile spaced, mimicking variance
          - name: qs
            title: Quantile spaced, IMSE-optimal
      default: esmv

    - name: plotOrder
      title: Global polynomial order for the plot
      type: Integer
      default: 4
      min: 1
      max: 10

    - name: plotWindow
      title: Restrict plot to the bandwidth window
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
