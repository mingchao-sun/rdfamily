title: 'RD Power and Sample Size'
name: rdpower
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Running variable'
            children:
                - type: VariablesListBox
                  name: running
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Treatment received (fuzzy RD, optional)'
            children:
                - type: VariablesListBox
                  name: treatment
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates (optional)'
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: 'Design'
      collapsed: false
      children:
          - type: TextBox
            name: cutoff
            label: 'Cutoff'
            format: number
          - type: ComboBox
            name: mode
          - type: TextBox
            name: tau
            label: 'Effect to detect (outcome units)'
            format: number
          - type: TextBox
            name: alpha
            label: 'Significance level'
            format: number
          - type: TextBox
            name: beta
            label: 'Target power'
            format: number
    - type: CollapseBox
      label: 'Local polynomial'
      collapsed: true
      children:
          - type: TextBox
            name: p
            label: 'Local polynomial order'
            format: number
          - type: ComboBox
            name: kernel
          - type: ComboBox
            name: bwselect
          - type: ComboBox
            name: vce
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: 'Method notes'
          - type: CheckBox
            name: showGuide
            label: 'Data and setup guide'
