---
name: rdgeo
title: RD Geographic / Two-Score Boundary
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Estimation
menuTitle: Geographic / Two-Score
menuSubtitle: Distance to a boundary

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treatment
      title: Treatment indicator (0/1; polyline boundary)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: x1
      title: Coordinate / score 1
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: x2
      title: Coordinate / score 2
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: bx
      title: Boundary vertex, coordinate 1 (polyline)
      type: Variable
      permitted:
          - numeric

    - name: by
      title: Boundary vertex, coordinate 2 (polyline)
      type: Variable
      permitted:
          - numeric

    - name: cluster
      title: Cluster (optional)
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: boundary
      title: Boundary
      type: List
      options:
          - name: polyline
            title: 'Polyline from vertex variables'
          - name: both
            title: 'Two scores: treated if both reach their cutoffs'
          - name: either
            title: 'Two scores: treated if either reaches its cutoff'
      default: polyline

    - name: c1
      title: Cutoff for score 1
      type: Number
      default: 0

    - name: c2
      title: Cutoff for score 2
      type: Number
      default: 0

    - name: p
      title: Local polynomial order
      type: Integer
      default: 1
      min: 0
      max: 8

    - name: bwselect
      title: Bandwidth selector
      type: List
      options:
          - name: mserd
            title: 'MSE-optimal, one common'
          - name: msetwo
            title: 'MSE-optimal, two different'
          - name: cerrd
            title: 'CER-optimal, one common'
          - name: certwo
            title: 'CER-optimal, two different'
      default: mserd

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: 'Triangular'
          - name: epanechnikov
            title: 'Epanechnikov'
          - name: uniform
            title: 'Uniform'
      default: triangular

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: nn
            title: 'Nearest neighbor'
          - name: hc0
            title: 'HC0'
          - name: hc1
            title: 'HC1'
          - name: hc2
            title: 'HC2'
          - name: hc3
            title: 'HC3'
      default: nn

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: donut
      title: Donut hole radius
      type: Number
      default: 0
      min: 0

    - name: plot
      title: Map of the sample
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
