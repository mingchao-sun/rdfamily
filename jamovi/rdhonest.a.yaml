---
name: rdhonest
title: RD Honest Confidence Intervals
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Alternative inference
menuTitle: Honest CIs
menuSubtitle: Armstrong and Kolesar (2020)

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treatment
      title: Treatment received (fuzzy design, optional)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: M
      title: Smoothness bound M on the second derivative (0 = rule of thumb)
      type: Number
      default: 0
      min: 0

    - name: optCriterion
      title: Bandwidth criterion
      type: List
      options:
          - name: MSE
            title: 'Minimize worst-case MSE'
          - name: FLCI
            title: 'Minimize honest CI length'
          - name: OCT
            title: 'Minimize optimal-conditional-test length'
      default: MSE

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: 'Triangular'
          - name: epanechnikov
            title: 'Epanechnikov'
          - name: uniform
            title: 'Uniform'
      default: triangular

    - name: seMethod
      title: Standard errors
      type: List
      options:
          - name: nn
            title: 'Nearest neighbor'
          - name: EHW
            title: 'Eicker-Huber-White'
      default: nn

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: hManual
      title: Manual bandwidth (0 = optimal)
      type: Number
      default: 0
      min: 0

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
