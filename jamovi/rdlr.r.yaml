---
name: rdlr
title: RD Local Randomization
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: sample
      title: Window and sample
      type: Table
      visible: (outcome)
      refs:
          - cattaneo2015
          - rdlocrand
      columns:
          - name: item
            title: ''
            type: text
          - name: left
            title: Left of cutoff
            type: text
          - name: right
            title: Right of cutoff
            type: text

    - name: test
      title: Randomization inference
      type: Table
      visible: (outcome)
      refs:
          - cattaneo2015
      columns:
          - name: stat
            title: Statistic
            type: text
          - name: obs
            title: Observed
            type: number
          - name: pfinite
            title: p (randomization)
            type: number
            format: zto,pvalue
          - name: pasy
            title: p (asymptotic)
            type: number
            format: zto,pvalue

    - name: winSel
      title: Window selection (covariate balance)
      type: Table
      visible: (winTable || windowMode:auto)
      refs:
          - cattaneo2015
      columns:
          - name: w
            title: Window (half-width)
            type: number
          - name: minp
            title: Min. p-value
            type: number
            format: zto,pvalue
          - name: bino
            title: Binomial p
            type: number
            format: zto,pvalue
          - name: nl
            title: N (left)
            type: integer
          - name: nr
            title: N (right)
            type: integer
...
