---
name: rdcmp
title: RD Compare Methods
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: cmp
      title: Estimates under alternative methods and specifications
      type: Table
      visible: (outcome)
      refs:
          - calonico2014
          - armstrong2020
          - cattaneo2015
      columns:
          - name: group
            title: Family
            type: text
          - name: label
            title: Specification
            type: text
          - name: coef
            title: Estimate
            type: number
          - name: se
            title: Std. error
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: lo
            title: CI lower
            type: number
          - name: hi
            title: CI upper
            type: number
          - name: h
            title: Bandwidth / window
            type: text
          - name: n
            title: N (left / right)
            type: text

    - name: cmpPlot
      title: Comparison of estimates
      type: Image
      width: 640
      height: 440
      renderFun: .plotCmp
      visible: (plot)
      clearWith:
          - outcome
          - running
          - treatment
          - covs
          - cluster
          - cutoff
          - level
          - cmpBw
          - cmpKernel
          - cmpOrder
          - cmpHonest
          - cmpLocrand
          - wLocrand
          - reps
          - seed
...
