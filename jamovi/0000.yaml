  - name: rdpower
    title: RD Power and Sample Size
    menuGroup: RDD
    menuSubgroup: Validity
    menuTitle: RD Power and Sample Size
    menuSubtitle: Power, minimum detectable effect and sample size of an RD design
    ns: rdfamily
