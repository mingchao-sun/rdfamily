  - name: rdcov
    title: RD Covariate Balance / Placebo Outcomes
    menuGroup: RDD
    menuSubgroup: Validity
    menuTitle: Covariate Balance
    menuSubtitle: Pre-determined covariates
    ns: rdfamily
