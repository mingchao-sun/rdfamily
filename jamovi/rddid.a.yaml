---
name: rddid
title: RD Difference-in-Discontinuities
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Estimation
menuTitle: Diff-in-Discontinuities
menuSubtitle: Grembi et al. (2016)

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: period
      title: Period (two values; the larger or later one is post)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: unit
      title: Unit identifier (optional; panel differencing)
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: p
      title: Local polynomial order
      type: Integer
      default: 1
      min: 0
      max: 8

    - name: bwselect
      title: Bandwidth selector
      type: List
      options:
          - name: mserd
            title: 'MSE-optimal, one common'
          - name: msetwo
            title: 'MSE-optimal, two different'
          - name: cerrd
            title: 'CER-optimal, one common'
          - name: certwo
            title: 'CER-optimal, two different'
      default: mserd

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: 'Triangular'
          - name: epanechnikov
            title: 'Epanechnikov'
          - name: uniform
            title: 'Uniform'
      default: triangular

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: nn
            title: 'Nearest neighbor'
          - name: hc0
            title: 'HC0'
          - name: hc1
            title: 'HC1'
          - name: hc2
            title: 'HC2'
          - name: hc3
            title: 'HC3'
      default: nn

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
