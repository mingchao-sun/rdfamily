---
name: rdsens
title: RD Robustness Checks
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Validity
menuTitle: Robustness Checks
menuSubtitle: Cutoffs, bandwidths, donut, order

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treatment
      title: Treatment received (fuzzy design, optional)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates (optional)
      type: Variables
      permitted:
          - numeric

    - name: cluster
      title: Cluster (optional)
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: cutVar
      title: Cutoff variable (multiple cutoffs, optional)
      type: Variable
      permitted:
          - numeric

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: p
      title: Local polynomial order
      type: Integer
      default: 1
      min: 0
      max: 8

    - name: bwselect
      title: Bandwidth selector
      type: List
      options:
          - name: mserd
            title: MSE-optimal, one common
          - name: msetwo
            title: MSE-optimal, two different
          - name: cerrd
            title: CER-optimal, one common
          - name: certwo
            title: CER-optimal, two different
      default: mserd

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: Triangular
          - name: epanechnikov
            title: Epanechnikov
          - name: uniform
            title: Uniform
      default: triangular

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: nn
            title: Nearest neighbor
          - name: hc0
            title: HC0
          - name: hc1
            title: HC1
          - name: hc2
            title: HC2
          - name: hc3
            title: HC3
      default: nn

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: placeboCheck
      title: Placebo cutoffs table
      type: Bool
      default: false

    - name: placeboFig
      title: Placebo cutoffs figure
      type: Bool
      default: false

    - name: placeboCuts
      title: Placebo cutoffs (comma-separated, running-variable units)
      type: String
      default: ""

    - name: bwCheck
      title: Bandwidth sensitivity table
      type: Bool
      default: false

    - name: bwFig
      title: Bandwidth sensitivity figure
      type: Bool
      default: false

    - name: bwMult
      title: Bandwidth multipliers
      type: String
      default: "0.5,0.75,1,1.25,1.5,2"

    - name: donutCheck
      title: Donut hole table
      type: Bool
      default: false

    - name: donutFig
      title: Donut hole figure
      type: Bool
      default: false

    - name: donutRadii
      title: Donut radii (comma-separated)
      type: String
      default: ""

    - name: polyCheck
      title: Polynomial order table
      type: Bool
      default: false

    - name: polyFig
      title: Polynomial order figure
      type: Bool
      default: false

    - name: polyOrders
      title: Polynomial orders
      type: String
      default: "1,2,3"

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
