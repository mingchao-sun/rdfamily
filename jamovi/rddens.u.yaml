name: rddens
title: RD Density (Manipulation) Test
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Running variable
            children:
                - type: VariablesListBox
                  name: running
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cutoff variable (multiple cutoffs)
            children:
                - type: VariablesListBox
                  name: cutVar
                  isTarget: true
                  maxItemCount: 1
    - type: TextBox
      name: cutoff
      label: Cutoff
      format: number
    - type: CollapseBox
      label: Estimation
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: TextBox
                  name: p
                  label: Polynomial order (p)
                  format: number
                - type: TextBox
                  name: q
                  label: Bias-correction order (q; 0 = p + 1)
                  format: number
                - type: ComboBox
                  name: kernel
                - type: ComboBox
                  name: fitselect
                - type: ComboBox
                  name: vce
                - type: TextBox
                  name: hManual
                  label: Manual bandwidth
                  format: number
    - type: CheckBox
      name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
