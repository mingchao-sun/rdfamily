---
name: rddens
title: RD Density (Manipulation) Test
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Validity
menuTitle: Density Test
menuSubtitle: Cattaneo et al. (2020)

options:
    - name: data
      type: Data

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: cutVar
      title: Cutoff variable (multiple cutoffs, optional)
      type: Variable
      permitted:
          - numeric

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: p
      title: Local polynomial order
      type: Integer
      default: 2
      min: 1
      max: 6

    - name: q
      title: Bias-correction order (0 = p + 1)
      type: Integer
      default: 0
      min: 0
      max: 8

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: Triangular
          - name: epanechnikov
            title: Epanechnikov
          - name: uniform
            title: Uniform
      default: triangular

    - name: fitselect
      title: Model for the bias-correction
      type: List
      options:
          - name: unrestricted
            title: Unrestricted (two-sided)
          - name: restricted
            title: Restricted (density continuous)
      default: unrestricted

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: jackknife
            title: Jackknife
          - name: plugin
            title: Asymptotic plug-in
      default: jackknife

    - name: hManual
      title: Manual bandwidth (0 = automatic)
      type: Number
      default: 0
      min: 0

    - name: plot
      title: Density plot
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
