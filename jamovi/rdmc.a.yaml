---
name: rdmc
title: RD Multiple Cutoffs
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Estimation
menuTitle: Multiple Cutoffs
menuSubtitle: Cutoff-specific and pooled (rdmulti)

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable (raw score)
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: cutVar
      title: Cutoff variable (cutoff faced by each observation)
      type: Variable
      permitted:
          - numeric

    - name: treatment
      title: Treatment received (fuzzy design, optional)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: p
      title: Local polynomial order
      type: Integer
      default: 1
      min: 0
      max: 8

    - name: bwselect
      title: Bandwidth selector
      type: List
      options:
          - name: mserd
            title: 'MSE-optimal, one common'
          - name: msetwo
            title: 'MSE-optimal, two different'
          - name: cerrd
            title: 'CER-optimal, one common'
          - name: certwo
            title: 'CER-optimal, two different'
      default: mserd

    - name: kernel
      title: Kernel
      type: List
      options:
          - name: triangular
            title: 'Triangular'
          - name: epanechnikov
            title: 'Epanechnikov'
          - name: uniform
            title: 'Uniform'
      default: triangular

    - name: vce
      title: Variance estimator
      type: List
      options:
          - name: nn
            title: 'Nearest neighbor'
          - name: hc0
            title: 'HC0'
          - name: hc1
            title: 'HC1'
          - name: hc2
            title: 'HC2'
          - name: hc3
            title: 'HC3'
      default: nn

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: Cutoff-specific effects plot
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
