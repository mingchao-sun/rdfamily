---
name: rdlr
title: RD Local Randomization
jas: '1.2'
version: '1.0.0'
menuGroup: RDD
menuSubgroup: Alternative inference
menuTitle: Local Randomization
menuSubtitle: Cattaneo et al. (2015)

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: running
      title: Running variable
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: covs
      title: Covariates for window selection (optional)
      type: Variables
      permitted:
          - numeric

    - name: cutVar
      title: Cutoff variable (multiple cutoffs, optional)
      type: Variable
      permitted:
          - numeric

    - name: cutoff
      title: Cutoff
      type: Number
      default: 0

    - name: windowMode
      title: Window
      type: List
      options:
          - name: manual
            title: Manual
          - name: auto
            title: Selected with covariates (rdwinselect)
      default: manual

    - name: wLeft
      title: Window width, left of cutoff
      type: Number
      default: 1
      min: 0

    - name: wRight
      title: Window width, right of cutoff
      type: Number
      default: 1
      min: 0

    - name: statistic
      title: Test statistic
      type: List
      options:
          - name: diffmeans
            title: Difference in means
          - name: ksmirnov
            title: Kolmogorov-Smirnov
          - name: ranksum
            title: Wilcoxon rank-sum
      default: diffmeans

    - name: polyOrder
      title: Polynomial adjustment order (0 = none)
      type: Integer
      default: 0
      min: 0
      max: 4

    - name: reps
      title: Randomizations
      type: Integer
      default: 1000
      min: 100
      max: 100000

    - name: nwindows
      title: Candidate windows (window selection)
      type: Integer
      default: 10
      min: 2
      max: 50

    - name: winTable
      title: Window selection table
      type: Bool
      default: false

    - name: seed
      title: Random seed
      type: Integer
      default: 1
      min: 1

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
...
