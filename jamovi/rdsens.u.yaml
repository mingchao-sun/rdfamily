name: rdsens
title: RD Robustness Checks
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Running variable
            children:
                - type: VariablesListBox
                  name: running
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment received (fuzzy RD)
            children:
                - type: VariablesListBox
                  name: treatment
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
          - type: TargetLayoutBox
            label: Cluster
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cutoff variable (multiple cutoffs)
            children:
                - type: VariablesListBox
                  name: cutVar
                  isTarget: true
                  maxItemCount: 1
    - type: TextBox
      name: cutoff
      label: Cutoff
      format: number
    - type: CollapseBox
      label: Estimation
      collapsed: true
      children:
          - type: LayoutBox
            children:
                - type: TextBox
                  name: p
                  label: Polynomial order (p)
                  format: number
                - type: ComboBox
                  name: bwselect
                - type: ComboBox
                  name: kernel
                - type: ComboBox
                  name: vce
                - type: TextBox
                  name: level
                  label: Confidence level (%)
                  format: number
    - type: CollapseBox
      label: Checks
      collapsed: true
      children:
          - type: CheckBox
            name: placeboCheck
          - type: CheckBox
            name: placeboFig
          - type: TextBox
            name: placeboCuts
            label: Placebo cutoffs (comma-separated, running-variable units)
            format: string
            enable: (placeboCheck || placeboFig)
          - type: CheckBox
            name: bwCheck
          - type: CheckBox
            name: bwFig
          - type: TextBox
            name: bwMult
            label: Bandwidth multipliers
            format: string
            enable: (bwCheck || bwFig)
          - type: CheckBox
            name: donutCheck
          - type: CheckBox
            name: donutFig
          - type: TextBox
            name: donutRadii
            label: Donut radii (comma-separated)
            format: string
            enable: (donutCheck || donutFig)
          - type: CheckBox
            name: polyCheck
          - type: CheckBox
            name: polyFig
          - type: TextBox
            name: polyOrders
            label: Polynomial orders
            format: string
            enable: (polyCheck || polyFig)
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
